[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appzo-voiceagent-v2"
version = "0.1.0"
description = "AppzoAI Goodbox and Plivo voice agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "loguru>=0.7,<1",
    "openai>=1.0,<2",
    "pipecat-ai[runner,cartesia,deepgram,silero,websocket]==1.7.0",
    "python-dotenv==1.2.2",
    "uvicorn[standard]>=0.30,<1",
    "websockets>=13,<16",
]

[tool.setuptools.packages.find]
include = ["voice_agent*"]

[tool.uv]
prerelease = "allow"
